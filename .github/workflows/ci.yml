name: Directory checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Start isolated PostgreSQL
        run: docker run --detach --name ruagentic-db-test-ci --label ruagentic.db-test=true --env POSTGRES_HOST_AUTH_METHOD=trust postgres:18
      - name: Wait for PostgreSQL
        # The image starts a temporary server during initialisation, so require two
        # real connections three seconds apart rather than a single pg_isready.
        run: |
          for i in $(seq 1 40); do
            if docker exec ruagentic-db-test-ci psql -U postgres -c 'select 1' >/dev/null 2>&1; then
              sleep 3
              docker exec ruagentic-db-test-ci psql -U postgres -c 'select 1' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo 'PostgreSQL did not become ready'; exit 1
      - run: python3 tests/database.py --container ruagentic-db-test-ci
